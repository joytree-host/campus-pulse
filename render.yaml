services:
  - type: web
    name: joytree-campus-pulse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false          # set to your deployed Vercel frontend URL, e.g. https://campus-pulse.vercel.app
      - key: STATUS_TARGETS
        sync: false          # e.g. "Student Portal|https://portal.example.edu,LMS|https://lms.example.edu"
      - key: STATUS_INTERVAL_MS
        value: 30000
      - key: DATABASE_URL
        sync: false          # point at a managed Postgres (Render Postgres, Supabase, or Neon) for production
