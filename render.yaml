services:
  - type: web
    name: joytree-campus-pulse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false          # set to your frontend URL once it's deployed, e.g. https://campus-pulse-web.onrender.com
      - key: STATUS_TARGETS
        sync: false          # e.g. "Student Portal|https://portal.example.edu,LMS|https://lms.example.edu"
      - key: STATUS_INTERVAL_MS
        value: 30000
      - key: DATABASE_URL
        sync: false          # point at a managed Postgres (Render Postgres, Supabase, or Neon) for production

  - type: web
    name: joytree-campus-pulse-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # your backend URL, e.g. https://joytree-campus-pulse-api.onrender.com
      - key: VITE_SOCKET_URL
        sync: false          # same as VITE_API_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
